<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Home Screen</title>
    <style>
        body {
            background-color: #202533;
        }

        .mobile-frame {

            height: 360px;
            width: 180px;
            background-color: #394257;
            box-shadow: 0 0 5px 1px #404040;
            margin: 20px auto;
            border-radius: 10px;
              padding:5px 15px;

        }

            .top-bar {
                padding: 5px;
                display: flex;
                justify-content: end;
              


            }
            .top-bar-icon {
                font-size: 10px;
                padding: 0 5px;
                color: #ffffff;
            }
            .weather-card {
                border:solid 1px tomato;
                height: 80px;
                width: 100%;
              
               
            }
                
            
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="top-bar">
            <i class="fa-solid fa-wifi top-bar-icon"></i>
            <i class="fa-solid fa-battery-half top-bar-icon"></i>
        </div>
        <div class="weather-card">

        </div>

    </div>
    <script src="https://kit.fontawesome.com/ea1b6ff3d9.js" crossorigin="anonymous"></script>
</body>

</html>
