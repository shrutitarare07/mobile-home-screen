<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Home Screen</title>
    <style>
        body {
            background-color: hsl(224, 59%, 58%);
        }

        .mobile-frame {

            width: 180px;
            background-color: #202533;
            #394257;
            box-shadow: 0 0 5px 1px #404040;
            margin: 20px auto;
            border-radius: 10px;
            padding: 5px 15px;

        }

        .top-bar {
            padding: 5px;
            display: flex;
            justify-content: end;
            margin-bottom: 10px;
            position: relative;




        }

        .top-bar-icon {
            font-size: 10px;
            margin: 4px 4px;
            color: #ffffff;
           
            
        }

        .weather-card {
            height: 80px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 5px 1px #404040;
            background-color:  #394257;;

            display: flex;
            flex-direction: column;
            align-items: start;
            padding: 20px 0;
            justify-content: space-evenly;
            position: relative;
            margin-top:20px;

        }

        .month-text {
            color: white;
            font-size: 7px;
            margin-left: 5px;
            margin-right: 5px;
        }

        .time-text {
            color: white;
            font-size: 30px;
            margin-left: 5px;
            margin-right: 5px;
        }

        .day {
            color: white;
            font-size: 7px;
            margin-left: 5px;
            margin-right: 5px;
        }

        .time-icon {
            color: white;
        }

        .cloud-icon {
            color: white;
            margin-left: 5px;
            margin-right: 5px;
        }

        .calendar-icon {
            position: absolute;
            top: 1px;
            right: 1px;
            color: white;


        }

        .cloud-position {
            position: absolute;
            top: 20px;
            right: 1px;
            
            
        }
        .clock-position {
            position: absolute;
            top: 1px;
            left: 1px;
          
           
        }
        .point {
            position: absolute;
            top: 20px;
            left: 1px;
            color: white;
        }
        .menu-icons{
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            margin-bottom: 10px;
            color: white;

        }
        .spotify-songs{
            background-color: #394257;
            height:50px;
            margin-top:50px ;
            margin-left: 5px;
            margin-right: 5px;
            border-radius: 5px;
             box-shadow: 0 0 5px 1px #5c5c3d;
             display: flex;
            justify-content: end;
            position: relative;
        }
        .gallary-container{
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            margin-left: 0;
            margin-right: 0;
        }

        .apps-group{
            background-color:  #394257;
          
            height:70px;
            width:70px;
            border-radius: 5px;
            box-shadow: 0 0 5px 1px #5c5c3d;
            color: white;
            font-size: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
        }
        .news-card{
            height:70px;
            width:70px;
       
            background-color:  #394257;
            border-radius: 5px;
            box-shadow: 0 0 5px 1px #5c5c3d;
        }
          .text{
            color: white;
            font-size: 10px;
            text-align: center;
            margin-top: 5px;
          }  
          .inspiration-text{
            color: white;
            font-size: 9px;
            text-align: right;
            margin-top: 5px;
            margin-right: 10px;
          }
          .icon-text{
            color: white;
            font-size: 9px;
            text-align: left;
            margin-top: 5px;
            margin-left: 10px;
          }
          .spotify-icon{
            position: absolute;
            top: 1px;
            right: 1px;
            color: white;
          }
          .music-icon{
            position: absolute;
            bottom: 0;
            left: 1px;
            color: white;
          }
    </style>
</head>

<body>

    <div class="mobile-frame">



        <div class="top-bar">

           <span class="clock-position"><i class="fa-regular fa-clock top-bar-icon"></i></span>
            <span class="cloud-position"><i class="fa-solid fa-cloud-sun top-bar-icon"></i></span>
           <span class="point">19.35</span>

            <i class="fa-solid fa-wifi top-bar-icon"></i>
            <i class="fa-solid fa-battery-half top-bar-icon"></i>
        </div>


        <div class="weather-card">
           
            <span class="calendar-icon"><i class="fa-regular fa-calendar-days "></i></span>
            <span class="month-text">OCTOBER</span>
            <span class="time-text">0:5</span>
            <span class="day">THURSDAY</span>

        </div>
        <p class="text">Calendar</p>
        <div class="gallary-container">
           <div class="apps-group">
            <i class="fa-regular fa-envelope"></i>
            <i class="fa-regular fa-message"></i>
            <i class="fa-regular fa-clock"></i>
            <i class="fa-brands fa-instagram"></i>
           </div>
      
           <div class="news-card">
          
           </div>
          
        </div>
         <p class="inspiration-text">Today's inspiration </p>
              <p class="icon-text">Icons</p>

        <div class="spotify-songs">
            <span class="spotify-icon"><i class="fa-brands fa-spotify"></i></span> 
            <span class="music-icon"><img src="./music.png" height="20px" width="20px" /></span>
        </div>

        <div class="menu-icons">
             <i class="fa-solid fa-square"></i>
             <i class="fa-solid fa-circle"></i>
             <i class="fa-solid fa-play"></i>
        </div>

    </div>
    <script src="https://kit.fontawesome.com/ea1b6ff3d9.js" crossorigin="anonymous"></script>
</body>

</html>
